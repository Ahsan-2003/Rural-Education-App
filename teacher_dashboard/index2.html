<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f4f0; }
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        .login-box h1 { color: #2e7d32; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1b5e20; }
        .error { color: red; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
        #dashboard { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #2e7d32; color: white; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>🏫 Teacher Dashboard</h1>
            <p>Rural Education App</p>
            <input type="email" id="email" placeholder="Teacher Email" value="admin@school.com">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <button onclick="handleLogin()">Login</button>
            <div id="loginMessage"></div>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; background: #2e7d32; color: white; padding: 15px 20px; border-radius: 8px;">
            <h2>🏫 Teacher Dashboard</h2>
            <div>
                <span id="teacherEmail"></span>
                <button onclick="logout()" style="width: auto; background: rgba(255,255,255,0.2); margin-left: 10px;">Logout</button>
            </div>
        </div>
        
        <h3>👨‍🎓 Students</h3>
        <div id="studentTable"></div>
        
        <h3>📊 Stats</h3>
        <div id="stats"></div>
    </div>

    <script>
        // =============================================
        // CONFIG
        // =============================================
        const SUPABASE_URL = 'https://hftjoljlsrneyrmiwgyc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdGpvbGpsc3JuZXlybWl3Z3ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5Njk2ODcsImV4cCI6MjEwMDU0NTY4N30.0iIVhiLezLs_ZW8qwbgbFe3fP2NRmxCNJ9uBvVVodw4';

        let supabase;

        // Initialize
        function initSupabase() {
            console.log('Initializing Supabase...');
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Supabase ready!');
        }

        // =============================================
        // LOGIN
        // =============================================
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('loginMessage');

            console.log('Login attempt:', email);

            if (!email || !password) {
                msg.innerHTML = '<p class="error">⚠️ Please enter email and password</p>';
                return;
            }

            msg.innerHTML = '<p>🔄 Logging in...</p>';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    console.error('Login error:', error);
                    msg.innerHTML = `<p class="error">❌ ${error.message}</p>`;
                    return;
                }

                console.log('Login success!', data.user);
                msg.innerHTML = '<p class="success">✅ Login successful!</p>';
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('teacherEmail').textContent = data.user.email;
                
                loadDashboard();
            } catch (e) {
                console.error('Error:', e);
                msg.innerHTML = `<p class="error">❌ ${e.message}</p>`;
            }
        }

        // =============================================
        // LOGOUT
        // =============================================
        async function logout() {
            await supabase.auth.signOut();
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        // =============================================
        // LOAD DASHBOARD
        // =============================================
        async function loadDashboard() {
            try {
                // Get students
                const { data: students, error } = await supabase
                    .from('students')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Get events
                const { data: events } = await supabase
                    .from('progress_events')
                    .select('*');

                // Display students
                let tableHTML = '<table><tr><th>Name</th><th>Class</th><th>Lessons</th><th>Quizzes</th><th>Last Sync</th></tr>';
                
                if (!students || students.length === 0) {
                    tableHTML += '<tr><td colspan="5" style="text-align:center;">No students yet. Students appear after syncing from app.</td></tr>';
                } else {
                    students.forEach(s => {
                        const sEvents = events?.filter(e => e.student_id === s.id) || [];
                        const lessons = sEvents.filter(e => e.event_type === 'lesson_completed').length;
                        const quizzes = sEvents.filter(e => e.event_type === 'quiz_submitted').length;
                        const lastSync = s.last_synced_at ? new Date(s.last_synced_at).toLocaleDateString() : 'Never';
                        
                        tableHTML += `<tr>
                            <td>${s.name}</td>
                            <td>${s.class_code || 'N/A'}</td>
                            <td>${lessons}</td>
                            <td>${quizzes}</td>
                            <td>${lastSync}</td>
                        </tr>`;
                    });
                }
                tableHTML += '</table>';
                document.getElementById('studentTable').innerHTML = tableHTML;

                // Stats
                const totalStudents = students?.length || 0;
                const lessonEvents = events?.filter(e => e.event_type === 'lesson_completed').length || 0;
                const quizEvents = events?.filter(e => e.event_type === 'quiz_submitted').length || 0;
                
                document.getElementById('stats').innerHTML = `
                    <p>📚 Total Students: <b>${totalStudents}</b></p>
                    <p>📖 Lessons Completed: <b>${lessonEvents}</b></p>
                    <p>📝 Quizzes Taken: <b>${quizEvents}</b></p>
                `;

            } catch (e) {
                console.error('Dashboard error:', e);
                document.getElementById('studentTable').innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
            }
        }

        // Initialize on page load
        window.onload = function() {
            console.log('Page loaded, initializing...');
            initSupabase();
        };
    </script>
    <script>
    alert('JavaScript is working!');
</script>
</body>
</html>
